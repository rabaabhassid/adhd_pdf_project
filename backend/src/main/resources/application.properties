spring.application.name=study-backend
spring.profiles.default=h2

# Load optional ./application-local.properties from the process working directory (e.g. backend/) — gitignored; put openrouter.api.key there.
spring.config.import=optional:file:./application-local.properties

# Secrets: set OPENROUTER_API_KEY in the environment, or openrouter.api.key in ./application-local.properties (see above).

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# PDFBox logs many WARNs for fonts without full Unicode maps (common for Arabic/custom embedded fonts).
# Extraction still runs; raise these loggers to ERROR to avoid console noise.
logging.level.org.apache.pdfbox.pdmodel.font=ERROR

# 8080 is taken here by Oracle TNS Listener (TNSLSNR.EXE); use a free port for Tomcat
server.port=8081

# Multipart file upload (PDF / PowerPoint)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Local directory for uploaded files (created automatically if missing)
study.upload.directory=uploads

# Max characters returned in JSON after PDF text extraction (0 = no limit)
study.pdf.max-extracted-chars=512000

# Chunk size for study sessions and OpenRouter summarization (same pass).
# Larger chunks → fewer OpenRouter calls per PDF (helps avoid 429 on free-tier models).
study.chunk.max-chars=5000

# OpenRouter — never commit keys here. Use env OPENROUTER_API_KEY or ./application-local.properties (gitignored).
openrouter.api.key=${OPENROUTER_API_KEY:}
# OpenRouter model id (see https://openrouter.ai/models). Paid/low-cost models may still return 429; retries + pause below help.
openrouter.model=anthropic/claude-sonnet-4.6
openrouter.connect-timeout-millis=30000
openrouter.read-timeout-millis=180000
# On HTTP 429, retry with linear backoff: wait delayMillis * attempt before next try
openrouter.retry.max-attempts=6
openrouter.retry.delay-millis=2500
# Pause between chunk simplification calls in adaptive mode (reduces burst 429s)
openrouter.pause-between-chunk-millis=1
# Optional pause before adaptive step-2 reorganization call (default 0)
openrouter.pause-between-pipeline-steps-millis=0
# Summarization sampling (OpenAI-compatible). Low temperature reduces randomness; omit optional keys to let the provider default.
openrouter.summarization.temperature=0.2
# Slightly higher temperature ok for quiz item variety; still low for factual consistency
openrouter.quiz.temperature=0.25
# openrouter.summarization.top-p=0.9
# openrouter.summarization.frequency-penalty=0.2
# openrouter.summarization.presence-penalty=0.0
# Optional OpenRouter leaderboard attribution
openrouter.http-referer=
openrouter.app-title=study-backend

# Max chunks that receive an LLM call per upload; remaining chunks still appear in the session with summary "Summary unavailable"
study.openrouter.max-chunks-per-upload=15

# Anonymous device auth uses an HTTP-only server session cookie after the browser device is verified.
study.auth.cookie-name=study_session
study.auth.cookie-secure=false
study.auth.session-days=30
