# PostgreSQL persistence for user profiles, uploads, sessions, and quiz continuity.
# Run with: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=postgres
# Put real local credentials in ./application-local.properties or environment variables.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/study_backend}
spring.datasource.username=${DATABASE_USERNAME:study_backend}
spring.datasource.password=${DATABASE_PASSWORD:study_backend}
