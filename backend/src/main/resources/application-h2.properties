# Local no-Postgres runtime profile. This is the default profile for plain spring-boot:run.
spring.datasource.url=jdbc:h2:file:./data/study_backend;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep the same migration/validation path as PostgreSQL so local data stays close to production.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
